# Supabase CLI settings for the hire system Edge Functions.
# `supabase link --project-ref <your-ref>` then `supabase functions deploy <name>`.
project_id = "real-time-traders"

[functions.create-checkout-session]
verify_jwt = true

[functions.cancel-booking]
verify_jwt = true

[functions.send-confirmation]
verify_jwt = true

# Stripe calls this one, so there is no Supabase JWT; the Stripe signature is checked instead.
[functions.stripe-webhook]
verify_jwt = false
